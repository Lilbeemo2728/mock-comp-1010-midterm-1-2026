  <style id="design-system">/* All visual values live here. Override through [data-theme="dark"] only. */

/* Mock Exam Builder reference design: calm classroom tool, paper-like surface, forest-green actions, amber progress accents. Use tokens only; do not add ad-hoc colors, fonts, or inline styles. */
* { box-sizing: border-box; }
html { background: var(--color-canvas); color: var(--color-ink); font: 400 var(--type-md)/1.55 var(--font-body); }
body { margin: 0; min-width: 320px; background: var(--color-canvas); color: var(--color-ink); }
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
a { color: var(--color-primary); }
.topbar { background: var(--color-primary); color: var(--color-primary-ink); }
.topbar__inner { max-width: var(--content-width); margin: auto; padding: var(--space-4) var(--space-5); display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.topbar__brand { display: grid; gap: .1rem; }
.topbar__eyebrow { font-size: var(--type-xs); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .82; }
.topbar__title { margin: 0; font: 400 var(--type-xl)/1.1 var(--font-display); letter-spacing: .035em; }
.topbar__actions { display: flex; gap: var(--space-2); align-items: center; }
.topbar .button--quiet { color: inherit; border-color: currentColor; background: transparent; }
.app-shell { max-width: var(--content-width); margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-7); }
.view { display: grid; gap: var(--space-5); }
.view__heading { display: flex; align-items: end; justify-content: space-between; gap: var(--space-4); }
.view__heading h1 { margin: 0; font: 400 var(--type-2xl)/1.02 var(--font-display); letter-spacing: .025em; }
.view__heading p { margin: var(--space-2) 0 0; color: var(--color-muted); max-width: var(--reading-width); }
.panel, .question-card, .topic-card, .result-card { border: 1px solid var(--color-line); border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-card); }
.panel { padding: var(--space-5); }
.panel h2, .panel h3 { margin: 0 0 var(--space-3); font-size: var(--type-lg); }
.panel p { margin: 0; color: var(--color-muted); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-4); }
.span-8 { grid-column: span 8; }
.span-4 { grid-column: span 4; }
.stat { display: grid; gap: var(--space-1); }
.stat__value { font: 400 var(--type-2xl)/1 var(--font-display); color: var(--color-primary); }
.stat__label { color: var(--color-muted); font-size: var(--type-sm); }
.button { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 2.75rem; padding: .65rem 1rem; border: 1px solid var(--color-primary); border-radius: var(--radius-sm); background: var(--color-primary); color: var(--color-primary-ink); font-weight: 700; text-decoration: none; transition: background .15s ease, transform .15s ease; }
.button:hover { background: var(--color-primary-hover); }
.button:active { transform: translateY(1px); }
.button--secondary { background: var(--color-surface); color: var(--color-primary); }
.button--secondary:hover { background: var(--color-accent-soft); }
.button--quiet { border-color: var(--color-line); background: transparent; color: var(--color-ink); }
.button--danger { border-color: var(--color-danger); background: var(--color-danger); color: var(--color-danger-ink); }
.button-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.pill { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .65rem; border-radius: var(--radius-pill); background: var(--color-accent-soft); color: var(--color-ink); font-size: var(--type-xs); font-weight: 700; }
.muted { color: var(--color-muted); }
.small { font-size: var(--type-sm); }
.progress { height: .65rem; overflow: hidden; border-radius: var(--radius-pill); background: var(--color-line); }
.progress__fill, .meter__fill { display: block; height: 100%; width: calc(var(--pct, 0) * 1%); border-radius: inherit; background: var(--color-accent); }
.meter { height: .55rem; overflow: hidden; border-radius: var(--radius-pill); background: var(--color-line); }
.topic-list { display: grid; gap: var(--space-2); padding: 0; margin: 0; list-style: none; }
.topic-row { display: grid; grid-template-columns: auto minmax(8rem, 1fr) minmax(7rem, 12rem) auto; gap: var(--space-3); align-items: center; padding: var(--space-3); border: 1px solid var(--color-line); border-radius: var(--radius-sm); background: var(--color-surface); }
.topic-row[draggable="true"] { cursor: grab; }
.topic-row.is-dragging { opacity: .55; }
.topic-row__label { font-weight: 700; }
.question-card { padding: var(--space-5); scroll-margin-top: 1rem; }
.question-card__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.question-card__stem { margin: 0 0 var(--space-4); font-size: var(--type-lg); font-weight: 700; line-height: 1.35; }
.options { display: grid; gap: var(--space-2); }
.option { display: flex; align-items: start; gap: var(--space-3); padding: .8rem .9rem; border: 1px solid var(--color-line); border-radius: var(--radius-sm); background: var(--color-surface-raised); cursor: pointer; }
.option:hover { border-color: var(--color-primary); }
.option input { margin-top: .35rem; accent-color: var(--color-primary); }
.option.is-correct { border-color: var(--color-success); background: var(--color-success-soft); }
.option.is-wrong { border-color: var(--color-danger); background: var(--color-danger-soft); }
.feedback { margin-top: var(--space-3); padding: var(--space-3); border-radius: var(--radius-sm); background: var(--color-surface-raised); }
.feedback--good { background: var(--color-success-soft); }
.feedback--bad { background: var(--color-danger-soft); }
.exam-toolbar { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px solid var(--color-line); border-radius: var(--radius-md); background: var(--color-surface); box-shadow: var(--shadow-card); }
.topic-section { display: grid; gap: var(--space-3); }
.topic-section__title { display: flex; justify-content: space-between; align-items: baseline; margin: var(--space-3) 0 0; font: 400 var(--type-xl)/1.1 var(--font-display); letter-spacing: .03em; }
.result-card { padding: var(--space-4); display: grid; gap: var(--space-3); }
.result-card__head { display: flex; justify-content: space-between; gap: var(--space-3); align-items: baseline; }
.result-card__head h3 { margin: 0; }
.result-row { display: grid; grid-template-columns: minmax(10rem, 1fr) 5rem minmax(5rem, 12rem); gap: var(--space-3); align-items: center; }
.result-table { width: 100%; border-collapse: collapse; }
.result-table th, .result-table td { text-align: left; padding: var(--space-2); border-bottom: 1px solid var(--color-line); }
.result-table th { font-size: var(--type-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--color-muted); }
.result-list { display: grid; gap: var(--space-3); }
.citation { display: inline-flex; align-items: center; gap: .35rem; margin-top: var(--space-3); font-weight: 700; }
.footer-note { padding-top: var(--space-4); border-top: 1px solid var(--color-line); color: var(--color-muted); font-size: var(--type-sm); }
.dialog-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: var(--space-4); background: var(--color-overlay); }
.dialog-backdrop[hidden] { display: none; }
.dialog { width: min(45rem, 100%); max-height: min(84vh, 55rem); overflow: auto; padding: var(--space-5); border: 1px solid var(--color-line); border-radius: var(--radius-lg); background: var(--color-surface); box-shadow: var(--shadow-dialog); }
.dialog__head { display: flex; align-items: start; justify-content: space-between; gap: var(--space-3); }
.dialog__head h2 { margin: 0; }
.source-text { white-space: pre-wrap; line-height: 1.8; }
mark { padding: .1em .15em; border-radius: .2em; background: var(--color-accent); color: var(--color-mark-ink); }
.empty-state { padding: var(--space-5); border: 1px dashed var(--color-line); border-radius: var(--radius-md); color: var(--color-muted); text-align: center; }
.hidden { display: none !important; }
@media (max-width: 760px) {
  .topbar__inner { align-items: start; padding: var(--space-3) var(--space-4); }
  .app-shell { padding: var(--space-4) var(--space-3) var(--space-6); }
  .grid { grid-template-columns: 1fr; }
  .span-8, .span-4 { grid-column: auto; }
  .view__heading { align-items: start; flex-direction: column; }
  .topic-row { grid-template-columns: auto 1fr auto; }
  .topic-row .meter { grid-column: 2 / 3; }
  .result-row { grid-template-columns: 1fr auto; }
  .result-row .meter { grid-column: 1 / -1; }
  .exam-toolbar { position: static; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
.space-top-2 { margin-top: var(--space-2); }
.space-top-4 { margin-top: var(--space-4); }
.space-top-5 { margin-top: var(--space-5); }
.app-footer { max-width: var(--content-width); margin: 0 auto; padding: var(--space-4) var(--space-5) var(--space-5); border-top: 1px solid var(--color-line); color: var(--color-muted); font-size: var(--type-sm); }
@media (max-width: 760px) { .app-footer { padding-inline: var(--space-3); } }

      if (!sa.total && sb.total) return -1;
      if (!sb.total && sa.total) return 1;
      return sa.pct-sb.pct || a.label.localeCompare(b.label);
    });
  }
  function conceptStats() {
    const latest=latestAttempt();
    if (latest?.concepts) return latest.concepts;
    const out={};
    for(const a of store.attempts) for(const [id,s] of Object.entries(a.concepts||{})) {
      out[id] ||= {correct:0,total:0,label:s.label,topic:s.topic};
      out[id].correct+=s.correct; out[id].total+=s.total;
    }
    return out;
  }
  function home() {
    clearInterval(timerHandle); mode="home"; activeMock=activePractice=null;
    const stats=weakestTopics(), last=latestAttempt();
    const total=store.attempts.reduce((n,a)=>n+a.total,0), correct=store.attempts.reduce((n,a)=>n+a.score,0);
    root.innerHTML=`
      <section class="view" aria-labelledby="home-heading">
        <header class="view__heading"><div><h1 id="home-heading">Study with a plan</h1><p>Take a full mock exam to measure mastery, or practice one topic with immediate feedback.</p></div><span class="pill">Version ${esc(manifest.version)}</span></header>
        <div class="grid">
          <article class="panel span-8"><h2>Mock Exam</h2><p>${esc(manifest.exam_length)} questions across ${esc(manifest.topics.length)} topics. Answers and citations appear after you submit.</p>
            <div class="button-row space-top-4"><button class="button" data-action="start-mock">Start mock exam</button><button class="button button--secondary" data-action="start-practice">Practice a topic</button></div></article>
          <article class="panel span-4"><div class="stat"><span class="stat__value">${total ? pct(correct,total)+"%" : "—"}</span><span class="stat__label">Overall mock accuracy</span></div><p class="small space-top-2">${store.attempts.length ? store.attempts.length+" submitted attempt"+(store.attempts.length===1?"":"s") : "No mock attempts yet"}</p></article>
        </div>
        <section class="panel"><div class="result-card__head"><h2>Topics and section order</h2><button class="button button--secondary" data-action="weak-first">Weakest first</button></div><p class="small muted">Drag sections or use the arrows. Recommendations use mock history only.</p><ul class="topic-list" id="topic-list">${store.order.map((id,i)=>topicRow(id,i)).join("")}</ul></section>
        <div class="grid"><section class="panel span-8"><h2>Latest weak areas</h2>${last?latestWeakHTML(last):'<div class="empty-state">Submit a mock exam to see topics that need review.</div>'}</section><section class="panel span-4"><h2>Mock history</h2>${store.attempts.length?historyHTML():'<div class="empty-state">Submitted mock exams appear here.</div>'}</section></div>
        <p class="footer-note">Mastery comes only from submitted mock exams. Practice never changes this record.</p>
      </section>`;
    const header=document.querySelector("#exam-title"); if(header) header.textContent=manifest.title;
  }
  function topicRow(id,index) {
    const topic=topicById.get(id), s=topicStats(id);
    const band=!s.total?"Not measured":bandFor(s.pct,s.total);
    return `<li class="topic-row" draggable="true" tabindex="0" data-topic-row="${esc(id)}" aria-label="${esc(topic.label)}, section ${index+1}">
      <span aria-hidden="true">↕</span><span class="topic-row__label">${esc(topic.label)} <span class="small muted">${esc(band)}</span></span>
      <div class="meter" role="progressbar" aria-label="${esc(topic.label)} mock accuracy" aria-valuenow="${s.pct}"><span class="meter__fill" style="--pct: ${s.pct}"></span></div>
      <span class="button-row"><button class="button button--quiet" data-action="move-topic" data-id="${esc(id)}" data-delta="-1" aria-label="Move ${esc(topic.label)} up">↑</button><button class="button button--quiet" data-action="move-topic" data-id="${esc(id)}" data-delta="1" aria-label="Move ${esc(topic.label)} down">↓</button></span></li>`;
  }
  function latestWeakHTML(attempt) {
    const rows=Object.entries(attempt.topics||{}).map(([id,s])=>({topic:topicById.get(id),s})).filter(x=>x.topic).sort((a,b)=>pct(a.s.correct,a.s.total)-pct(b.s.correct,b.s.total));
    const concepts=Object.values(attempt.concepts||{}).sort((a,b)=>pct(a.correct,a.total)-pct(b.correct,b.total)).slice(0,3);
    const topicHtml=rows.length?'<ul>'+rows.slice(0,3).map(({topic,s})=>`<li><strong>${esc(topic.label)}</strong>: ${s.correct}/${s.total} correct</li>`).join("")+'</ul>':'';
    const conceptHtml=concepts.length?'<p class="small"><strong>Concepts to revisit:</strong> '+concepts.map(c=>esc(c.label)+' ('+c.correct+'/'+c.total+')').join(', ')+'</p>':'';
    return rows.length?topicHtml+conceptHtml+'<p class="small muted">Practice is ranked from your latest mock exam.</p>':'<p class="muted">No topic data in the latest attempt.</p>';
  }
  function historyHTML() { return '<ol reversed>'+store.attempts.slice(-5).reverse().map(a=>`<li>${esc(new Date(a.date).toLocaleDateString())} · <strong>${a.score}/${a.total}</strong></li>`).join("")+'</ol>'; }
  function sampleMock() {
    const selected=[];
    for(const id of store.order) selected.push(...shuffle(items.filter(q=>q.topic===id)).slice(0,Number(topicById.get(id)?.quota||0)));
    return selected;
  }
  function startMock() {
    const questions=sampleMock();
    if(questions.length!==Number(manifest.exam_length)){alert("The bank does not contain enough questions for the configured topic quotas.");return;}
    activeMock={questions,answers:{},submitted:false}; mode="mock"; renderMock();
    const seconds=Number(manifest.timer_seconds_per_item||0)*questions.length;
    if(seconds>0) startTimer(seconds);
  }
  function startTimer(seconds) {
    let remaining=seconds;
    const tick=()=>{const n=document.getElementById("time-left");if(n)n.textContent=Math.ceil(remaining/60)+" min";if(remaining--<=0){clearInterval(timerHandle);submitMock();}};
    tick();timerHandle=setInterval(tick,1000);
  }
  function renderMock() {
    const total=activeMock.questions.length, done=Object.keys(activeMock.answers).length;
    const groups=store.order.map(id=>{
      const topic=topicById.get(id), qs=activeMock.questions.filter(q=>q.topic===id);
      return qs.length?`<section class="topic-section" aria-labelledby="section-${esc(id)}"><h2 class="topic-section__title" id="section-${esc(id)}">${esc(topic.label)} <span class="pill">${qs.length} questions</span></h2>${qs.map(q=>questionCard(q,activeMock.answers[q.id],activeMock.submitted,activeMock.questions.indexOf(q)+1)).join("")}</section>`:"";
    }).join("");
    root.innerHTML=`<section class="view" aria-labelledby="mock-heading"><header class="view__heading"><div><h1 id="mock-heading">Mock Exam</h1><p>Complete the whole exam before answers and citations appear. Unanswered items count as incorrect.</p></div><button class="button button--quiet" data-action="home">Exit exam</button></header>
      <div class="exam-toolbar"><span><strong>${done}/${total}</strong> answered</span><div class="progress" role="progressbar" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct(done,total)}" style="--pct: ${pct(done,total)}"><span class="progress__fill"></span></div><span id="time-left" class="small muted"></span><button class="button" data-action="submit-mock">Submit whole exam</button></div>${groups}</section>`;
  }
  function questionCard(q,selected,revealed,number) {
    const inputType=q.type==="msq"?"checkbox":"radio", name="answer-"+q.id;
    const options=q.options.map((option,index)=>{
      const checked=q.type==="msq"?Array.isArray(selected)&&selected.includes(index):selected===index;
      const isCorrect=q.type==="msq"?q.answer.includes(index):q.answer===index;
      const state=revealed?(isCorrect?" is-correct":checked?" is-wrong":""):"";
      return `<label class="option${state}"><input type="${inputType}" name="${esc(name)}" value="${index}" ${checked?"checked":""} ${revealed?"disabled":""}><span>${esc(option)}</span></label>`;
    }).join("");
    const feedback=revealed?`<div class="feedback ${eqAnswer(selected??(q.type==="msq"?[]:-1),q.answer,q.type)?"feedback--good":"feedback--bad"}" aria-live="polite"><strong>${eqAnswer(selected??(q.type==="msq"?[]:-1),q.answer,q.type)?"Correct":"Review this answer"}</strong><p>${esc(q.explanation)}</p><button class="button button--secondary" data-action="citation" data-id="${esc(q.id)}">View source</button></div>`:"";
    return `<article class="question-card" id="card-${esc(q.id)}" data-question="${esc(q.id)}"><div class="question-card__meta"><span class="pill">Question ${number}</span><span class="muted small">${esc(topicById.get(q.topic)?.label||q.topic)}</span>${q.type==="msq"?'<span class="pill">Select all that apply</span>':""}</div><h3 class="question-card__stem">${esc(q.stem)}</h3><div class="options">${options}</div>${feedback}</article>`;
  }
  function submitMock() {
    if(!activeMock||activeMock.submitted)return;
    clearInterval(timerHandle);
    const topics={},concepts={},formats={},levels={}; let score=0;
    for(const q of activeMock.questions){
      const selected=activeMock.answers[q.id]??(q.type==="msq"?[]:-1), correct=eqAnswer(selected,q.answer,q.type);
      if(correct)score++;
      topics[q.topic]||={correct:0,total:0};topics[q.topic].total++;if(correct)topics[q.topic].correct++;
      concepts[q.concept]||={correct:0,total:0,label:q.concept_label||q.concept,topic:q.topic};concepts[q.concept].total++;if(correct)concepts[q.concept].correct++;
      formats[q.type]||={correct:0,total:0};formats[q.type].total++;if(correct)formats[q.type].correct++;
      levels[q.level]||={correct:0,total:0};levels[q.level].total++;if(correct)levels[q.level].correct++;
    }
    const attempt={date:new Date().toISOString(),version:manifest.version,score,total:activeMock.questions.length,topics,concepts,formats,levels,itemIds:activeMock.questions.map(q=>q.id)};
    store.attempts.push(attempt);save();activeMock.submitted=true;mode="results";renderResults(attempt);
  }
  function bandFor(value,total) {
    if(!total)return "Not measured";
    const low=Number(manifest.mastery_bands?.developing_below??.5)*100, secure=Number(manifest.mastery_bands?.secure_at??.8)*100;
    return value<low?"Developing":value<secure?"Progressing":"Secure";
  }
  function statTable(stats) {
    const rows=Object.entries(stats||{});
    return rows.length?`<table class="result-table"><thead><tr><th>Group</th><th>Score</th></tr></thead><tbody>${rows.map(([name,s])=>`<tr><td>${esc(name)}</td><td>${s.correct}/${s.total}</td></tr>`).join("")}</tbody></table>`:'<p class="muted">No data.</p>';
  }
  function renderResults(attempt) {
    const cards=manifest.topics.map(t=>{const s=attempt.topics[t.id]||{correct:0,total:0},p=pct(s.correct,s.total);return `<article class="result-card"><div class="result-card__head"><h3>${esc(t.label)}</h3><strong>${s.correct}/${s.total}</strong></div><div class="meter"><span class="meter__fill" style="--pct: ${p}"></span></div><p class="small muted">${bandFor(p,s.total)} · latest mock</p></article>`;}).join("");
    const review=activeMock.questions.map((q,i)=>questionCard(q,activeMock.answers[q.id],true,i+1)).join("");
    root.innerHTML=`<section class="view" aria-labelledby="results-heading"><header class="view__heading"><div><h1 id="results-heading">Mock Exam Results</h1><p>You scored ${attempt.score} of ${attempt.total}. Mastery was updated from this complete mock exam.</p></div><span class="stat__value">${pct(attempt.score,attempt.total)}%</span></header>
      <div class="grid"><section class="panel span-8"><h2>Score by topic</h2><div class="result-list">${cards}</div></section><section class="panel span-4"><h2>Score by question type</h2>${statTable(attempt.formats)}<h2 class="space-top-5">Score by cognitive level</h2>${statTable(attempt.levels)}</section></div>
      <section class="panel"><h2>Review answers and sources</h2><p class="small muted">Sources and explanations are available after submission.</p><div class="result-list space-top-4">${review}</div></section><div class="button-row"><button class="button" data-action="home">Back to study plan</button><button class="button button--secondary" data-action="start-practice">Practice weak areas</button></div></section>`;
  }
  function startPractice(topicId) {
    if(!topicId){
      mode="practice-picker";
      const suggested=weakestTopics();
      root.innerHTML=`<section class="view" aria-labelledby="practice-picker-heading"><header class="view__heading"><div><h1 id="practice-picker-heading">Practice by topic</h1><p>Choose one topic for this practice quiz. Weakest topics appear first based on mock attempts.</p></div><button class="button button--quiet" data-action="home">Back to study plan</button></header><div class="result-list">${suggested.map(t=>{const s=topicStats(t.id,true);return `<button class="result-card" data-action="practice-topic" data-id="${esc(t.id)}"><span class="result-card__head"><strong>${esc(t.label)}</strong><span>${s.total?s.pct+"% latest":"Not measured"}</span></span><span class="small muted">Start a focused practice quiz</span></button>`;}).join("")}</div></section>`;
      return;
    }
    const ids=[topicId], concepts=conceptStats(), plan=[];
    for(const id of ids){
      const pool=items.filter(q=>q.topic===id);
      pool.sort((a,b)=>{const sa=concepts[a.concept],sb=concepts[b.concept],pa=sa?pct(sa.correct,sa.total):-1,pb=sb?pct(sb.correct,sb.total):-1;return pa-pb||Math.random()-.5;});
      plan.push(...pool.slice(0,10));
    }
    if(!plan.length){alert("There are no questions for this topic.");return;}
    activePractice={questions:plan,index:0,answers:{},answered:false};mode="practice";renderPractice();
  }
  function renderPractice() {
    const q=activePractice.questions[activePractice.index], done=activePractice.index;
    root.innerHTML=`<section class="view" aria-labelledby="practice-heading"><header class="view__heading"><div><h1 id="practice-heading">Topic Practice</h1><p>${esc(topicById.get(q.topic)?.label||q.topic)} · Question ${done+1} of ${activePractice.questions.length}. Practice does not change mastery.</p></div><button class="button button--quiet" data-action="home">End practice</button></header>
      <div class="exam-toolbar"><span>${done}/${activePractice.questions.length} completed</span><div class="progress" role="progressbar" aria-valuenow="${pct(done,activePractice.questions.length)}" style="--pct: ${pct(done,activePractice.questions.length)}"><span class="progress__fill"></span></div><button class="button button--quiet" data-action="skip">Not sure / Skip</button></div>
      ${questionCard(q,activePractice.answers[q.id],activePractice.answered,done+1)}${q.type==="msq"&&!activePractice.answered?'<div class="button-row"><button class="button" data-action="check-practice">Check answer</button></div>':""}${activePractice.answered?'<div class="button-row"><button class="button" data-action="practice-next">Next question</button></div>':""}</section>`;
  }
  function showCitation(id) {
    const q=items.find(x=>x.id===id)||activeMock?.questions.find(x=>x.id===id), dialog=document.getElementById("source-dialog");
    if(!q||!dialog)return;
    const pageMap=sourcePages[q.source.file]||{}, page=pageMap[String(q.source.page)]??pageMap[q.source.page]??"";
    const text=typeof page==="string"?page:(page.text||"");
    const safe=esc(text), excerpt=esc(q.source.excerpt);
    const marked=excerpt&&safe.includes(excerpt)?safe.replace(excerpt,"<mark>"+excerpt+"</mark>"):safe;
    dialog.innerHTML=`<div class="dialog-backdrop" data-action="close-dialog"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="source-title"><div class="dialog__head"><div><h2 id="source-title">Source · ${esc(q.source.loc)}</h2><p class="small muted">${esc(q.source.file)} · page/slide ${esc(q.source.page)}</p></div><button class="button button--quiet" data-action="close-dialog" aria-label="Close source viewer">Close</button></div><p class="source-text">${marked}</p><a href="sources/${encodeURIComponent(q.source.file)}" target="_blank" rel="noopener">Open original file</a></section></div>`;
    dialog.hidden=false;dialog.querySelector("button")?.focus();
  }
  function moveTopic(id,delta) {
    const i=store.order.indexOf(id), j=i+delta;if(j<0||j>=store.order.length)return;
    [store.order[i],store.order[j]]=[store.order[j],store.order[i]];save();home();
  }
  root.addEventListener("change",event=>{
    const input=event.target.closest("input");if(!input)return;
    if(mode==="mock"&&activeMock&&!activeMock.submitted){
      const card=input.closest("[data-question]"),q=activeMock.questions.find(x=>x.id===card?.dataset.question);if(!q)return;
      if(q.type==="msq"){const selected=[...card.querySelectorAll("input:checked")].map(x=>Number(x.value));if(selected.length)activeMock.answers[q.id]=selected;else delete activeMock.answers[q.id];}
      else activeMock.answers[q.id]=Number(input.value);
      const done=Object.keys(activeMock.answers).length,total=activeMock.questions.length,progress=root.querySelector(".progress"),label=root.querySelector(".exam-toolbar strong");if(label)label.textContent=done+"/"+total;if(progress){const value=pct(done,total);progress.setAttribute("aria-valuenow",String(value));progress.style.setProperty("--pct",String(value));}
    } else if(mode==="practice"&&activePractice&&!activePractice.answered){
      const q=activePractice.questions[activePractice.index],card=input.closest("[data-question]");if(!q||!card)return;
      activePractice.answers[q.id]=q.type==="msq"?[...card.querySelectorAll("input:checked")].map(x=>Number(x.value)):Number(input.value);
      if(q.type!=="msq"){activePractice.answered=true;renderPractice();}
    }
  });
  root.addEventListener("click",event=>{
    const node=event.target.closest("[data-action]");if(!node)return;const action=node.dataset.action;
    if(action==="home")home();
    else if(action==="start-mock")startMock();
    else if(action==="start-practice")startPractice();
    else if(action==="practice-topic")startPractice(node.dataset.id);
    else if(action==="submit-mock")submitMock();
    else if(action==="weak-first"){store.order=weakestTopics().map(t=>t.id);save();home();}
    else if(action==="move-topic")moveTopic(node.dataset.id,Number(node.dataset.delta));
    else if(action==="citation")showCitation(node.dataset.id);
    else if(action==="close-dialog"){if(event.target===node||node.tagName==="BUTTON")document.getElementById("source-dialog").hidden=true;}
    else if(action==="check-practice"){if(activePractice){activePractice.answered=true;renderPractice();}}
    else if(action==="skip"||action==="practice-next"){if(activePractice.index+1>=activePractice.questions.length){activePractice=null;home();}else{activePractice.index++;activePractice.answered=false;renderPractice();}}
  });
  root.addEventListener("dragstart",event=>{const row=event.target.closest("[data-topic-row]");if(!row)return;row.classList.add("is-dragging");event.dataTransfer.setData("text/plain",row.dataset.topicRow);});
  root.addEventListener("dragend",event=>event.target.closest("[data-topic-row]")?.classList.remove("is-dragging"));
  root.addEventListener("dragover",event=>{if(event.target.closest("[data-topic-row]"))event.preventDefault();});
  root.addEventListener("drop",event=>{const target=event.target.closest("[data-topic-row]"),source=event.dataTransfer.getData("text/plain");if(!target||!source||target.dataset.topicRow===source)return;event.preventDefault();const from=store.order.indexOf(source),to=store.order.indexOf(target.dataset.topicRow);store.order.splice(from,1);store.order.splice(to,0,source);save();home();});
  document.addEventListener("keydown",event=>{
    const dialog=document.getElementById("source-dialog");
    if(event.key==="Escape"&&dialog&&!dialog.hidden){dialog.hidden=true;return;}
    if(event.key==="Enter"&&event.ctrlKey&&mode==="mock"){event.preventDefault();submitMock();}
    if(/^[1-5]$/.test(event.key)&&(mode==="mock"||mode==="practice")){
      const card=document.activeElement.closest?.("[data-question]")||document.querySelector(".question-card:focus-within");
      const input=card?.querySelectorAll("input")[Number(event.key)-1];if(input&&!input.disabled){input.checked=!input.checked;input.dispatchEvent(new Event("change",{bubbles:true}));}
    }
  });
  const themeButton=document.querySelector("[data-theme-toggle]");
  themeButton?.addEventListener("click",()=>{store.theme=store.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=store.theme;save();});
  home();
})();</script>
</body>
</html>
